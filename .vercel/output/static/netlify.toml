[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/create-payment"
  to = "/.netlify/functions/create-payment"
  status = 200

[[redirects]]
  from = "/api/check-payment"
  to = "/.netlify/functions/check-payment"
  status = 200

[[redirects]]
  from = "/api/payos-webhook"
  to = "/.netlify/functions/payos-webhook"
  status = 200

[[redirects]]
  from = "/api/accesstrade"
  to = "/.netlify/functions/accesstrade"
  status = 200

[[redirects]]
  from = "/api/stats"
  to = "/.netlify/functions/stats"
  status = 200

[[redirects]]
  from = "/api/auto-sync"
  to = "/.netlify/functions/auto-sync"
  status = 200
